name: Bug report
description: Report a reproducible problem in agentic-toolkit.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a reproducible problem. Do not include private data or security details - see SECURITY.md.
  - type: input
    id: environment
    attributes:
      label: Harness and OS
      placeholder: e.g. Claude Code 0.2.29, macOS 15.0 / Codex / Antigravity
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
