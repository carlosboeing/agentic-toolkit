name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite and linting
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          which jq || brew install jq
          which shellcheck || brew install shellcheck

      - name: Run git hooks test suite
        run: bash tests/test-githooks.sh

      - name: Run sync-toolkit test suite
        run: bash tests/test-sync-toolkit.sh

      - name: Run drift guard test suite
        run: bash git-hooks/drift-guard/test-housekeep.sh

      - name: Run schedule-resume test suite
        run: sh skills/schedule-resume/tests/run-tests.sh

      - name: Run relative links unit tests
        run: python3 -m unittest discover -s tests -p 'test_relative_links.py'

      - name: Check relative links across public Markdown
        run: python3 scripts/check-relative-links.py

      - name: Run ShellCheck on all shell scripts
        run: |
          git ls-files | while read -r f; do
            if [ -f "$f" ]; then
              case "$f" in
                *.sh) echo "$f" ;;
                *)
                  first=$(head -n 1 "$f" 2>/dev/null)
                  case "$first" in
                    \#!/bin/sh*|\#!/usr/bin/env\ sh*|\#!/bin/bash*|\#!/usr/bin/env\ bash*)
                      echo "$f" ;;
                  esac
                  ;;
              esac
            fi
          done | xargs shellcheck -S error

  required:
    name: required
    needs: [test]
    if: always()
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test job failed or was cancelled: ${{ needs.test.result }}"
            exit 1
          fi
          echo "All required checks passed."
