name: Feature request
description: Suggest a change to <PROJECT_NAME>.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Explain the problem first. Keep the proposal focused on one change.
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
    validations:
      required: false
